    <title>Trax</title>
    <script>
      // Runs before React mounts to set data-theme synchronously, preventing
      // a flash of the wrong theme. Must stay in vanilla JS (no module
      // imports run this early) — keep THEME_STORAGE_KEY in sync with
      // src/constants/theme.js.
      (function () {
        var THEME_STORAGE_KEY = "trax-theme-preference";
        try {
          var stored = localStorage.getItem(THEME_STORAGE_KEY);
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
<script type="text/javascript">
      // Undo the redirect the 404.html page above performed for a deep-linked
      // route, restoring the real URL before the app's router reads it.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
